<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Bookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>
    <svg class="icon-svg" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
    </svg>
    GitHub PR Bookmarks
    <span class="byline">Made With ❤️ By OferLH</span>
  </h1>

  <div id="status" class="status unknown">Checking status…</div>

  <div id="pr-list" class="pr-list"></div>

  <div class="actions">
    <button id="sync-btn">Sync Now</button>
    <button id="options-btn">Settings</button>
  </div>
  <div class="footer" id="footer">Syncs every 5 minutes using your GitHub session</div>

  <script src="popup.js" type="module"></script>
</body>
</html>
