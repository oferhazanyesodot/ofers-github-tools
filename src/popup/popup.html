<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofer's GitHub Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>
    <svg class="icon-svg" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
    </svg>
    Ofer's GitHub Tools
    <span class="byline">Made With ❤️ By OferLH</span>
  </h1>

  <div id="status" class="status unknown">Checking status…</div>

  <div id="copilot-usage" class="copilot-usage hidden">
    <div class="copilot-header" id="copilot-header">
      <svg class="copilot-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M7.998 15.035c-4.562 0-7.873-2.914-7.998-3.749V9.338c.085-.628.677-1.686 1.588-2.065.013-.07.024-.143.036-.218.029-.183.06-.384.126-.612-.201-.508-.254-1.084-.254-1.656 0-.87.138-1.756.377-2.282.394-.868 1.25-1.833 1.979-2.125.209-.084.418-.125.629-.125.185 0 .394.04.607.121.269.1.484.248.652.39C6.196.483 7.028.025 7.998.025c.97 0 1.802.458 2.258.966.168-.142.383-.29.652-.39.212-.081.422-.121.607-.121.21 0 .42.041.629.125.729.292 1.585 1.257 1.979 2.125.239.526.377 1.412.377 2.282 0 .572-.053 1.148-.254 1.656.066.228.097.43.126.612.012.076.023.148.036.218.911.379 1.503 1.437 1.588 2.065v1.948c-.125.835-3.436 3.749-7.998 3.749l-.002-.001ZM3.635 9.545c-.572 0-1.036.464-1.036 1.036 0 .572.464 1.036 1.036 1.036.573 0 1.036-.464 1.036-1.036 0-.572-.463-1.036-1.036-1.036Zm8.73 0c-.572 0-1.036.464-1.036 1.036 0 .572.464 1.036 1.036 1.036.573 0 1.036-.464 1.036-1.036 0-.572-.463-1.036-1.036-1.036ZM7.998 1.525c-1.156 0-2.904.852-2.904 4.263 0 1.344.375 2.553.998 3.405.626.856 1.36 1.182 1.906 1.182.546 0 1.28-.326 1.906-1.182.623-.852.998-2.061.998-3.405 0-3.411-1.748-4.263-2.904-4.263Z"/>
      </svg>
      <span class="copilot-title" id="copilot-title-link" title="Open GitHub Copilot settings">Copilot Usage</span>
      <span class="copilot-stats" id="copilot-stats"></span>
      <span class="copilot-collapse" id="copilot-collapse" title="Toggle">▾</span>
    </div>
    <div class="copilot-body" id="copilot-body">
      <div class="copilot-bar-container" id="copilot-bar-container" title="">
        <div class="copilot-bar" id="copilot-bar"></div>
        <div class="copilot-bar-projected" id="copilot-bar-projected"></div>
      </div>
      <div class="copilot-details" id="copilot-details"></div>
      <div class="copilot-projection" id="copilot-projection"></div>
      <canvas id="copilot-sparkline" class="copilot-sparkline" width="340" height="32"></canvas>
    </div>
  </div>

  <div id="pr-list" class="pr-list"></div>

  <div class="actions">
    <button id="sync-btn">Sync Now</button>
    <button id="options-btn">Settings</button>
  </div>
  <div class="footer" id="footer">Syncs every 5 minutes using your GitHub session</div>

  <script src="popup.js" type="module"></script>
</body>
</html>
