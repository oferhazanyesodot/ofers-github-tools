<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Bookmarks — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>GitHub PR Bookmarks</h1>
  <p class="subtitle">Configure which pull requests appear in your bookmark folder.</p>

  <fieldset>
    <legend>Query</legend>
    <label for="query">GitHub search query</label>
    <p class="hint">Appended to <code>https://github.com/pulls?q=</code></p>
    <div class="presets">
      <button type="button" class="preset-btn" data-query="is:pr state:open archived:false sort:updated-desc author:@me">My PRs</button>
      <button type="button" class="preset-btn" data-query="is:pr state:open archived:false sort:updated-desc review-requested:@me">Review requested</button>
      <button type="button" class="preset-btn" data-query="is:pr state:open archived:false sort:updated-desc assignee:@me">Assigned to me</button>
      <button type="button" class="preset-btn" data-query="is:pr state:open archived:false sort:updated-desc mentions:@me">Mentions me</button>
    </div>
    <input type="text" id="query" placeholder="is:pr state:open archived:false sort:updated-desc author:@me">
  </fieldset>

  <fieldset>
    <legend>Sync</legend>
    <div class="row">
      <label for="interval">Sync every</label>
      <input type="number" id="interval" min="1" max="60" value="5">
      <span>minutes</span>
    </div>
    <p class="hint">Minimum 1 minute. Lower values use more resources.</p>
  </fieldset>

  <fieldset>
    <legend>Bookmark Folder</legend>
    <label for="folder-name">Folder name</label>
    <input type="text" id="folder-name" placeholder="GitHub PRs">
    <p class="hint">The folder created in your Bookmarks Bar.</p>
  </fieldset>

  <div class="actions">
    <button class="btn-primary" id="save-btn">Save Settings</button>
    <button class="btn-secondary" id="reset-btn">Reset to Defaults</button>
  </div>
  <div class="toast" id="toast">Settings saved. Syncing now…</div>

  <script src="options.js" type="module"></script>
</body>
</html>
