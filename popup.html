<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Bookmarks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      color: #24292f;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
        color: #e6edf3;
      }
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .status.ok {
      background: #dafbe1;
      color: #116329;
    }
    .status.error {
      background: #ffebe9;
      color: #82071e;
    }
    .status.not_logged_in {
      background: #fff8c5;
      color: #4d2d00;
    }
    .status.unknown {
      background: #f6f8fa;
      color: #57606a;
    }
    @media (prefers-color-scheme: dark) {
      .status.ok {
        background: #0f291a;
        color: #3fb950;
      }
      .status.error {
        background: #2d1117;
        color: #f85149;
      }
      .status.not_logged_in {
        background: #272115;
        color: #d29922;
      }
      .status.unknown {
        background: #161b22;
        color: #8b949e;
      }
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      color: #24292f;
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover {
      background: #eaeef2;
    }
    button:active {
      background: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      button {
        border-color: #30363d;
        background: #21262d;
        color: #e6edf3;
      }
      button:hover {
        background: #30363d;
      }
      button:active {
        background: #3d444d;
      }
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #57606a;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .footer {
        color: #8b949e;
      }
    }
  </style>
</head>
<body>
  <h1>
    <svg class="icon-svg" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
    </svg>
    GitHub PR Bookmarks
  </h1>
  <div id="status" class="status unknown">Checking status…</div>
  <div class="actions">
    <button id="sync-btn">Sync Now</button>
  </div>
  <div class="footer">Syncs every 5 minutes using your GitHub session</div>
  <script src="popup.js"></script>
</body>
</html>
