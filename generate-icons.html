<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>GitHub PR Bookmark Folder - Icon Generator</h2>
<p>Right-click each canvas and "Save Image As" to the icons/ folder with the corresponding filename.</p>
<div>
  <h3>icon16.png</h3>
  <canvas id="c16" width="16" height="16"></canvas>
</div>
<div>
  <h3>icon48.png</h3>
  <canvas id="c48" width="48" height="48"></canvas>
</div>
<div>
  <h3>icon128.png</h3>
  <canvas id="c128" width="128" height="128"></canvas>
</div>
<script>
function drawIcon(canvas) {
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  const s = size / 128;

  // Background rounded rect
  ctx.fillStyle = '#24292f';
  const r = 16 * s;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fill();

  // PR icon (merge symbol)
  ctx.strokeStyle = '#ffffff';
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 8 * s;
  ctx.lineCap = 'round';

  // Vertical line
  ctx.beginPath();
  ctx.moveTo(44 * s, 30 * s);
  ctx.lineTo(44 * s, 98 * s);
  ctx.stroke();

  // Branch line
  ctx.beginPath();
  ctx.moveTo(84 * s, 30 * s);
  ctx.lineTo(84 * s, 60 * s);
  ctx.quadraticCurveTo(84 * s, 80 * s, 64 * s, 85 * s);
  ctx.lineTo(44 * s, 90 * s);
  ctx.stroke();

  // Dots
  ctx.beginPath();
  ctx.arc(44 * s, 24 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(84 * s, 24 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(44 * s, 104 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
}

drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
